# ============================================================
# 行行出状元 · 通用能力层 · 自动评审闭环流水线
# 仓库：hanghangchuzhuangyuan（通用能力层）
#
# 核心机制（同步自 dongjiagoushi / youxikaifaxilieagent 的自动评审闭环）：
#   - pull_request 事件 → 测试信号灯 + NPC 代码审查
#   - 评审发现需修改 → 评审NPC在评论中 @CodeBuddy → 自动触发修复
#   - CodeBuddy 修复提交 → 新 commit 触发下一轮 pull_request → 再次评审
#   - 目标导向：评审无错即停，有错继续修，不强制轮数
#   - pull_request.approved → 评审通过后用 PR 自己的配置重跑检查并合并
#   - pull_request.changes_requested → 评审打回时自动修复（兜底）
#   - pull_request.comment@npc → 人类/@NPC 手动兜底
#   - main.push → 全量回归 + 知识库更新
#   - issue.comment@npc → Issue 里 @CodeBuddy 直接应答
#   - issue.open/update **不配置**：原先只打一行 echo，白占预冻结配额
#
# pull_request.mergeable **刻意不配置**：该事件的配置与工作区都取自目标分支
# （官方「代码版本选择」：mergeable → 合并前目标分支最新 Commit）。PR 改了 .cnb.yml
# 时，合并门禁跑的是 main 上的旧配置——想修 CI 却先在旧配置上再红一轮，改的人
# 永远看不到自己的修复生效（PR #29 连红三轮即此）。评审通过后由
# pull_request.approved 重跑同一份 stages 并合并：配置与代码都取自预合并。
#
# 角色定义见 .cnb/settings.yml
# 评审闭环规则见 docs/评审修复闭环护栏.md
# ============================================================

# ---- NPC 镜像复用锚点 ----
.npc_default: &npc_default
  docker:
    image: cnbcool/default-npc:latest

# ---- 兜底分支（仓库级事件都在此处理）----
$:
  # ========================================================
  # 主评审闭环：PR 提交/更新 → 测试 → NPC 代码审查 → 修复闭环
  # ========================================================
  pull_request:
    - name: review-fix-loop
      # 配额：**不写 runner.cpus**，也不配置 allowFailure。
      # 官方「定价 · 用量计算规则」：每 5 min 预冻结一次，冻结用量 = 5min × 节点规格，
      # 预冻结时额度不足就立即终止任务。所以核数只改变"每次冻结多少"，改变不了
      # "额度已经见底"——2 核试过、1 核也试过，Prepare 报的仍是同一句话：
      #   events CPU core-hours are insufficient for pre-freezing(1.33 core-hours)
      # 1.33 = 1 核 × 1/3 小时，正是默认 1 核节点规格下一次 5min 冻结的量，
      # 与"申请几核"无关，只说明「云原生构建-CPU」额度已经见底（免费 160 核时/月）。
      # 配置层没有替代品，只有根组织提升额度这一条路。
      # 想"不标红"只有 Pipeline 级 allowFailure 一条路（语法手册：为 true 时流水线
      # 失败状态不上报到 CNB），但它会把真实的测试失败一并吞掉，这里刻意不用。
      docker:
        image: python:3.11
        volumes:
          - cache:/root/.cnb-testcache:rw   # 变更感知结果缓存（跨 job/流水线复用，防重复全量）
      env:
        HH_TEST_CACHE_DIR: /root/.cnb-testcache
      # 这份 stages 被 pull_request 与 pull_request.approved 共用（YAML 锚点）：
      # 评审通过后要重跑一次同样的检查并合并，各写一份迟早漂移，改一边忘一边。
      stages: &pr_checks
        - name: 测试信号灯（变更感知 + CLI 冒烟）
          script: |
            set -e
            echo "==== 自动化测试（变更感知选择器） ===="
            pip install -q -r requirements.txt
            # PR 阶段只跑受本次变更影响的测试（"公交车攒批"机制）：
            # 变更感知选择器基于 PR diff 精确选取受影响测试，
            # 不盲目对每个 commit 全量跑 180+ 用例。
            # main 合并后的全量回归由 main.push 事件兜底，不会漏测。
            # 变更感知内核自校验：工具自身改动也会被护栏兜底（评审 #26 🟡2）。
            # ca-plan 属于"基建"，不会触发业务回归；故独立固定 fixture 校验其穿透逻辑不回退。
            python3 scripts/ca-plan-selfcheck.py
            # M11 岗位卡一致性：改了 data/role-profiles 或 data/workflow-templates
            # 却忘了重渲 data/rolecards 时，这里直接拦下（否则产物与数据静默分叉）。
            python3 scripts/gen_rolecards.py --check
            # M11.1 链条守门：链上出现公司名 / 未登记行业类 → 直接失败。
            # 「类落到列表和索引，公司靠检索查」这条规矩由数据校验兜住，不靠人盯。
            python3 src/hanghang/cli/main.py role chain --check
            # M11.2 词表目录化后，DDL 与数据字典是从域文件生成的产物：
            # 改了类目却忘了重导出，这里拦下（否则库里结构和仓库里的口径会分叉）。
            python3 scripts/export_class_db.py --check
            # M11.3 实库：把画像 + 词表建成真库，再读回来逐字段比对。
            # 改了画像忘了重建库 → 这里失败；库与仓库分叉不会静默发生。
            python3 scripts/build_role_db.py --check
            bash scripts/change-aware-test.sh
            # CLI 冒烟测试
            echo ""
            echo "==== CLI 冒烟测试 ===="
            python3 src/hanghang/cli/main.py route "架构设计方案" | grep -q "architect" && echo "  ✅ 路由冒烟通过" || { echo "  ❌ 路由冒烟失败"; exit 1; }
            python3 src/hanghang/cli/main.py route "帮我点个外卖" | grep -q "人工" && echo "  ✅ 回落冒烟通过" || { echo "  ❌ 回落冒烟失败"; exit 1; }
            # M11 行业分区库是「数据即产品」：yaml 漂移必须由流水线兜底，不能靠自觉
            echo ""
            echo "==== M11 行业分区库自检 ===="
            # 退出码 2 = 只剩"待建分区骨架没人认领"（补职业这项活没干完），
            # 不是数据坏了：这一档要让 PR 绿着进门，否则所有 PR 都会被同一批已知缺口卡死。
            # 1 = 真问题，必须红。
            rc=0; python3 src/hanghang/cli/main.py industry check || rc=$?
            if [ "$rc" = "2" ]; then echo "  ⚠️ 已知未完成项（待建分区补职业），不阻断"; fi
            [ "$rc" = "0" ] || [ "$rc" = "2" ] || exit "$rc"
            # 结构产物（data/industry-db/*.sql）是「买服务器怎么建库」的契约：
            # 改了分区/职业字段却忘了重生成，或者 DDL 与数据灌不进库，这里拦下。
            # --check 会真灌一份临时 SQLite 再读回行数，不只看文件非空。
            python3 scripts/export_industry_db.py --check
            # 合并判定放在这里，不另起一条 mergeable 流水线：那条读的是目标分支的
            # .cnb.yml（官方「代码版本选择」：mergeable → 合并前目标分支最新 Commit），
            # PR 改流水线时它跑旧配置，改的人永远看不到修复生效（见文件头）。
            if [ "$CNB_PULL_REQUEST_REVIEW_STATE" = "approve" ]; then
              echo "评审已通过，标记待合并"
              MERGE_PENDING=true
            else
              echo "评审状态: ${CNB_PULL_REQUEST_REVIEW_STATE:-未评审}，测试已通过，不执行自动合并"
              MERGE_PENDING=false
            fi
            # 必须走 CNB 的自定义变量输出协议，shell 变量出不了这个 stage
            echo "##[set-output merge=$MERGE_PENDING]"
          # 合并判定跨 stage 传递：变量由 ##[set-output key=value] 解析进 Job result，
          # 再由 exports 带出。script 子进程里的 shell 变量出了 stage 就不存在，
          # 下个 stage 直接读它会让条件恒假、合并静默不执行，而表现是"全绿"。
          #
          # ⚠️ 上一版抄的是 GitHub Actions 的 GITHUB_OUTPUT 文件约定 —— CNB 没有
          #    这个文件，`[ -n "$XXX" ]` 恒假，判定从未进过 result，exports 导出
          #    空串 → 合并条件恒假 → 门禁永久失效而流水线仍全绿。
          exports:
            merge: MERGE_PENDING
        - name: 评审通过才合并
          # 合并判定就挂在测试流水线末尾：评审一通过（pull_request.approved 那次
          # 运行）就由同一份 stages 收尾，不需要第三条流水线。
          #
          # ⚠️ 取值是 approve / unapprove（官方「环境变量」），不是 approved。
          #    写错的那一版条件恒假 → 门禁永久失效，而失败形态是"全绿"，最难查。
          #    所以下面这条 script 会先把取到的值打进日志：真取不到 approve 时，
          #    日志里能看见 "REVIEW_STATE=" 是空的，而不是无声地跳过合并。
          script: |
            set -e
            echo "REVIEW_STATE=${CNB_PULL_REQUEST_REVIEW_STATE:-<空>}"
            echo "MERGE_PENDING=${MERGE_PENDING:-<空>}"
            # 空值 = 导出链路坏了（输出协议/ exports / 上一步没执行），
            # 这时合并条件恒假但流水线全绿——最难查的形态。这里把它变成显式红。
            if [ -z "${MERGE_PENDING:-}" ]; then
              echo "❌ MERGE_PENDING 未导出：合并门禁已失效，请检查 ##[set-output] 与 exports"
              exit 1
            fi
            if [ "$CNB_PULL_REQUEST_REVIEW_STATE" = "approve" ] && [ "$MERGE_PENDING" = "true" ]; then
              echo "判定：评审通过 → 合并"
            else
              echo "判定：未满足（评审状态或测试判定不通过）→ 不合并"
            fi
        - name: 合并（评审通过 + 测试绿）
          # 权限边界：合并主体是流水线，不是 NPC。NPC 只有只读审查权，
          # 这一步由人「允许合并」触发 pull_request.approved 事件后才可能执行。
          if: '[ "$CNB_PULL_REQUEST_REVIEW_STATE" = "approve" ] && [ "$MERGE_PENDING" = "true" ]'
          type: git:auto-merge
          options:
            mergeType: squash
            removeSourceBranch: true
    - name: npc-code-review
      <<: *npc_default
      stages:
        - name: NPC 代码审查
          type: npc:go
          options:
            role: 代码审查员
            systemPrompt: |
              你是本仓库（hanghangchuzhuangyuan · 通用能力层路由编排系统）的资深代码审查员。
              你的职责**只有两条**：**读代码 + 给意见**。
              【权限边界声明】你是评审者（监督者），仅拥有只读审查权限：
              - 你有权：读取代码、审查质量/架构/Bug/安全，输出审查结论；
              - 你无权：推送（push）、合并（merge）、关闭（close）、修改代码、打标签；
              - **本系统设计不允许 push**：评审闭环通过 PR 评论 + 事件驱动，任何 NPC **不得尝试 push**；
              - 若评审发现问题需要修复：**不得自己动手**。**必须在结论末尾召唤
                @dongdongxiaozu/hanghangchuzhuangyuan(CodeBuddy) 触发自动修复**。
            userPrompt: |
              请审查本次 PR 的代码变更，重点检查：
              1. 是否符合通用能力层架构设计（M1-M8 模块：路由/注册表/前缀/会话编排/交接/复合装配/指标/能力索引）；
              2. 路由逻辑是否正确（行业识别→岗位识别→复合装配→回落人工）；
              3. 稳定前缀约束是否保持（一会话一行业）；
              4. 是否存在 Bug、安全漏洞或资源泄漏；
              5. 是否包含自动化测试且测试通过。
              给出结论：
              - **通过/approved**：若未发现需修复的缺陷，明确说明"无问题"，不召唤任何人；
              - **需修改/needs_modification**：逐条列出问题与修改点，末尾必须 @CodeBuddy
                召唤修复（格式: @dongdongxiaozu/hanghangchuzhuangyuan(CodeBuddy)），
                让 CodeBuddy 自动接管修复。
              评审结论输出到 PR 评论。

  # ========================================================
  # 评审通过 → 用 PR 自己的配置重跑检查并合并
  #
  # 为什么不是 pull_request.mergeable：那个事件的配置和工作区都取自目标分支。
  # PR 改了 .cnb.yml 时合并门禁跑的是旧配置，改的人看不到自己的修复生效。
  # 这里是"测试绿 + 评审通过"的最后一个事件，代码与配置都取自预合并，
  # 合并前那次验证才算数。
  # ========================================================
  pull_request.approved:
    - name: merge-on-approve
      docker:
        image: python:3.11
        volumes:
          - cache:/root/.cnb-testcache:rw
      env:
        HH_TEST_CACHE_DIR: /root/.cnb-testcache
      stages: *pr_checks

  # ========================================================
  # 评审打回(changes_requested) → 自动修复
  # ========================================================
  pull_request.changes_requested:
    - name: auto-fix
      <<: *npc_default
      stages:
        - name: CodeBuddy 自动修复
          type: npc:go
          options:
            role: CodeBuddy
            systemPrompt: |
              你是本仓库（hanghangchuzhuangyuan · 通用能力层）的代码修复 Agent。
              收到评审打回后默认直接修改代码并提交，遵循"评审修复闭环护栏"：
              - 目标导向：修复到评审不再发现问题为止。有错就继续修，无错即自然结束，
                不需要"凑满多少轮"；
              - 安全上限：若连续多轮修复仍未解决（最多 5 轮），停止并反馈人类介入；
              - 每修一个评审点，尽量固化成测试断言，防止回退；
              - 禁止尝试 push；修复完成通过提交代码触发下一轮自动评审。
            userPrompt: |
              本次 PR 被评审打回（changes requested）。请作为代码修复 Agent 执行：
              1. 读取评审意见与行级评论；
              2. 默认直接修复评审指出的问题（Bug 优先，再质量/性能/架构）；
              3. 为每个修复点补充测试断言，确保持续生效不回退；
              4. 在 PR 源分支提交修复代码；
              5. 在 PR 评论中说明修复内容。
              目标导向：修复到评审通过为止。本轮修复后由自动评审机制判断是否需要
              继续；若评审不再发现问题则自然结束，无需额外操作。

  # ========================================================
  # PR 评论 @CodeBuddy（自动兜底：人类手动 @ 或评审 NPC 召唤修复）
  # ========================================================
  pull_request.comment@npc:
    - name: npc-manual-invoke
      runner:
        cpus: 2
      <<: *npc_default
      stages:
        - name: CodeBuddy 按 @ 指令处理
          type: npc:go
          options:
            role: CodeBuddy
            systemPrompt: |
              你是本仓库（hanghangchuzhuangyuan · 通用能力层）的代码处理 Agent。
              评论中 @你可能是人类手动召唤，也可能是评审 NPC 在发现问题后自动召唤修复。
              无论来源如何，都请按评论内容认真处理。
              若评论者是评审 NPC（OCI/代码审查员）并指出需修复的问题：
              - 默认直接修复，不反复询问；
              - 每次修复必须补充测试断言，防止回退；
              - 修复完成后提交代码到 PR 源分支，并在评论中说明修复内容，
                评审会在下次 commit 后自动复审——若无问题自然停止，无需额外召唤。
            userPrompt: |
              PR 评论中 @CodeBuddy 发起了指令（可能来自人类手动召唤或评审 NPC 自动召唤）。
              请根据评论内容执行：
              1. 若指令是要求修复代码问题（含评审 NPC 指出的 Bug/质量/架构问题）：
                 默认直接修复并提交到 PR 源分支；
              2. 若指令是询问/探讨：直接给出分析与结论，不修改代码；
              3. 若指令是要求新增功能/配置：按指令实现并提交。
              目标导向：修复完不必反复追问，提交后由自动评审机制决定是否需要下一轮。

  # ========================================================
  # Issue 事件处理
  #
  # issue.open / issue.update **刻意不配置**：原来这两条各起一台 1 核机器，
  # 只为打一行 echo。配额一紧，"没内容"的流水线抢预冻结额度的结果不是它自己挂，
  # 而是同一组织的 PR 检查在 Prepare 阶段就红（PR #29 连红三轮即此）。
  # 真要做自动打标/派发再配，别先占着位置空转。
  # ========================================================
  issue.comment@npc:
    - name: issue-npc-reply
      runner:
        cpus: 2
      <<: *npc_default
      stages:
        - name: CodeBuddy 回应
          type: npc:go
          options:
            role: CodeBuddy
            systemPrompt: |
              你是本仓库（hanghangchuzhuangyuan · 通用能力层路由编排系统）的 CodeBuddy 助手。
              当被 @ 召唤时，请响应并帮助处理。
            userPrompt: |
              收到 Issue 评论召唤。请根据评论内容给出回应或处理。

# ========================================================
# main 分支 push 事件（PR 合并后或直接 push main）
# ========================================================
main:
  push:
    - name: full-regression
      docker:
        image: python:3.11
      stages:
        - name: 全量回归测试
          script: |
            set -e
            echo "==== 全量回归测试 ===="
            pip install -q -r requirements.txt
            python3 - <<'PY'
            import os, sys, subprocess
            tests_dir = 'tests'
            failed = []
            for f in sorted(os.listdir(tests_dir)):
                if f.startswith('test_') and f.endswith('.py'):
                    print(f"\n==== 运行: {f} ====")
                    rc = subprocess.call([sys.executable, os.path.join(tests_dir, f)])
                    if rc != 0:
                        failed.append(f)
                        print(f"  ❌ {f} 失败")
                    else:
                        print(f"  ✅ {f} 通过")
            if failed:
                print(f"\n失败测试: {failed}")
                sys.exit(1)
            print("\n✅ 全部测试通过")
            PY
        - name: M11 行业分区库自检
          script: |
            set -e
            pip install -q -r requirements.txt
            # main 全量回归同理：1 才失败，2 是已知未完成（若数据真坏了会变成 1）
            rc=0; python3 src/hanghang/cli/main.py industry check || rc=$?
            if [ "$rc" = "2" ]; then echo "⚠️ 已知未完成项（待建分区补职业），不阻断"; fi
            [ "$rc" = "0" ] || [ "$rc" = "2" ] || exit "$rc"
            python3 scripts/export_industry_db.py --check
        - name: M11 导出扁平表
          # 只做"导得出来"的产物校验：仓库没有 generic 制品库，CNB 也没有通用的
          # 文件产物上传入口（git:release 不支持附件），所以这里不假装有发布通道。
          # 真要发布时再接 cnbcool/attachments 或 generic 制品库，别写成伪配置。
          script: |
            set -e
            pip install -q -r requirements.txt
            python3 src/hanghang/cli/main.py industry export --out out/industry-db
            # 10 份产物：7 份给 BI/知识库直接吃（含六口径规模账与资金流守恒账的
            # 扁平表），3 份是「买服务器直接建库」用的双方言 DDL + 与方言无关的数据 SQL。
            for f in industry-db.json partitions.csv occupations.csv industry.sqlite \
                     scales.csv money-nodes.csv money-flows.csv \
                     00-schema.sqlite.sql 00-schema.postgresql.sql 10-data.sql; do
              test -s "out/industry-db/$f" || { echo "  ❌ 导出缺失: $f"; exit 1; }
            done
            echo "  ✅ 行业分区库 10 份导出产物齐全（含六口径账/资金流账与双方言 DDL）"
    - name: build-knowledge-base
      stages:
        - name: knowledge update
          type: knowledge:update
          options:
            include: "**/*.md"
            exclude:
              - "poc/**"
            chunkSize: 1500
            embeddingModel: hunyuan
            issueSyncEnabled: true
            ignoreProcessFailures: true
