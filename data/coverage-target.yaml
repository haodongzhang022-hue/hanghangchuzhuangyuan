# ============================================================================
# 行业岗位覆盖目标全集 · coverage-target
# 作用：作为「整体目标(分母) vs 当前覆盖(分子)」的进度基准清单。
#   - 提供全局行业/岗位覆盖率的统一口径，供 coverage 命令与 Web 面板统计；
#   - 引导通过各渠道持续搜集、补齐岗位/职业/行业，形成可追踪记录；
#   - 已注册行业由 unit-index 自动归为 registered，无需改本文件。
#
# 说明：本清单为「初版基线」，行业全集随多渠道搜集持续增补；
#       新增目标行业只需在 targets 追加一条声明，无需修改代码（数据驱动）。
# 参考基线：国民经济行业分类门类(GB/T 4754) + 高频可被 AI 数字员工承接的
#           服务/职业场景。行业 name 与 unit-index.yaml 的 industry 对齐以自动判覆盖。
# ============================================================================
version: "0.3"        # 清单版本
updated_at: "2026-10-29"
baseline_note: "初版基线，待各渠道搜集核实后迭代增补；注册单元自动判为已覆盖，无需手动维护"

# 目标行业全集：每个条目 = 一个应可路由的行业单位(细粒度)。
# 字段说明：
#   id           行业标识(建议=未来 unit_id 命名，短横线小写)
#   name         行业名，与 unit-index.industry 对齐可自动识别为已覆盖
#   category     所属国民经济/服务大类(便于分门别类看清缺口)
#   target_roles 该行业首批应覆盖的代表性岗位(岗位基线；可随扩充持续加项)
#   status       registered=已有单元覆盖 / pending=待通过渠道搜集后建单元
#   priority     高/中/低，决定补充先后
#   channels     建议的搜集渠道(对应"通过各渠道充分搜集岗位职业行业"落地项)
#   note         备注
