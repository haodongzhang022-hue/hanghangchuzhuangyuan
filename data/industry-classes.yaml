# ============================================================================
# M11.1 行业类词表（industry-classes）
# 用途：把「利益链条」里的上下游，从写死的公司名收敛成**行业类目**。
#
# 为什么要这层：岗位画像要通用，就不能把上游写成"某某钢材加工厂"。
#   链上应该写的是「钢材加工」「金属材料加工」这类**类目名**，
#   具体公司靠 类 → 名录索引 → 公司搜索 去查，**不落库、不进画像**。
#
# 三层引用（value_ref 里写）：
#   industry_class  类目：钢材加工 / 品牌方 / 用人部门 …（本文件，稳定、可复用、可跨行业共享）
#   interface       接口：岗位交接协议面（M5 交接卡、合并门禁、发布渠道 …）
#   role            岗位：本单元或其他单元的岗位名（跨单元在 class 里标 unit）
#
# 校验：`python3 src/hanghang/cli/main.py role chain --check`
#   - 链上写成了公司形态（XX有限公司 / 某某厂 / XX集团 …）→ FAIL，落库被拦
#   - 类目不在词表 → FAIL，要求先登记类目（防止同义词扩散）
#   - 类目录了但没有索引（index）也没标 alias_of → WARN，说清是"还没接索引"
#   - role 类目在本单元不存在 → WARN（上级单元的岗位跨域复用是允许的，但要写 unit）
# ============================================================================
version: "1.0"
updated_at: "2026-10-29"

# 公司形态识别（写进画像即视为"把具体公司存进来了"）
company_markers:
  - 有限公司
  - 有限责任公司
  - 股份有限公司
  - 股份公司
  - 集团公司
  - 集团
  - 某某
  - 某厂
  - 工厂
  - 分公司
  - 子公司

# ---------------------------------------------------------------- 类目词表
# kind: 类目本体的种类（制造/服务/渠道/机构/内部组织/资源/货品…），仅作分类展示
# index: 到"具体公司"的检索方式。值为 dict = 可检索方案；null = 尚未接索引
classes:
  # ---- 制造与供应链
  钢材加工:        {kind: 制造, index: {source: 企业名录, query: ["钢材{加工|剪切|开平}", "金属材料加工"]}}
  金属材料加工:    {kind: 制造, index: {source: 企业名录, query: ["金属材料加工"]}}
  商品与供应链:    {kind: 货品与流通, index: {source: 内部主数据, query: ["SKU 类目", "供应商类目"]}}
  房屋现状:        {kind: 资源, index: null}

  # ---- 客户与需求侧
  用户:            {kind: 需求方, index: {source: 会员主数据, query: ["用户画像与分群"]}}
  客户:            {kind: 需求方, index: {source: CRM, query: ["客户档案"]}}
  业主:            {kind: 需求方, index: {source: CRM, query: ["业主档案"]}}
  业主需求:        {kind: 需求, index: null}
  咨询者自述:      {kind: 输入, index: null}
  学员:            {kind: 需求方, index: {source: 学员主数据, query: ["在册学员"]}}
  候选人:          {kind: 需求方, index: {source: ATS, query: ["候选人库"]}}
  品牌方:          {kind: 需求方, index: {source: 客户库, query: ["品牌客户"]}}
  业务方:          {kind: 需求方, index: {source: 组织架构, query: ["业务部门"]}}
  需求方:          {kind: 需求方, index: {source: 组织架构, query: ["需求提出部门"]}}
  各处室需求:      {kind: 需求, index: null}
  产品与用户洞察:  {kind: 输入, index: null}
  市场与销售:      {kind: 需求方, index: {source: 组织架构, query: ["市场与销售部门"]}}
  教学目标:        {kind: 输入, index: null}
  业务单据:        {kind: 输入, index: null}

  # ---- 交付侧接口（不落在具体公司）
  合并门禁:        {kind: 接口, index: null}
  发布渠道:        {kind: 渠道, index: {source: 渠道台账, query: ["发布渠道"]}}
  测试与发布:      {kind: 接口, index: null}
  运维:            {kind: 接口, index: null}
  前端开发:        {kind: 岗位类, index: {source: 组织架构, query: ["前端团队"]}}
  法务:            {kind: 内部组织, index: null}
  财务:            {kind: 内部组织, index: null}
  品牌:            {kind: 内部组织, index: null}
  医疗与专业机构:  {kind: 机构, index: {source: 医疗机构名录, query: ["医疗机构"]}}
  医疗机构:        {kind: 机构, index: {source: 医疗机构名录, query: ["医疗机构"]}}

  # ---- 企业内部组织
  管理层:          {kind: 内部组织, index: null}
  决策者:          {kind: 内部组织, index: null}
  全体成员:        {kind: 内部组织, index: null}
  业务执行方:      {kind: 内部组织, index: {source: 组织架构, query: ["承接部门"]}}
  用人部门:        {kind: 内部组织, index: null}
  用人经理:        {kind: 内部组织, index: null}
  员工:            {kind: 内部组织, index: null}

  # ---- 补充（M11.1 归一后新增）
  需求方与文案:    {kind: 需求, index: null}
  各执行岗位:      {kind: 内部组织, index: null}
  后续维护者:      {kind: 岗位类, index: {source: 代码仓库, query: ["CODEOWNERS"]}}
  团队:            {kind: 内部组织, index: null}
  产品:            {kind: 岗位类, index: {source: 组织架构, query: ["产品团队"]}}

  # ---- 阻碍因素（原因侧，不落公司）
  跨岗口径不一致:  {kind: 阻碍, index: null}
  流程遗漏:        {kind: 阻碍, index: null}
  合规风险:        {kind: 阻碍, index: null}
  隐私与歧视风险:  {kind: 阻碍, index: null}
  越过医疗边界:    {kind: 阻碍, index: null}
  预算与工期失真:  {kind: 阻碍, index: null}
  玩法验证不足:    {kind: 阻碍, index: null}
  效果不可归因:    {kind: 阻碍, index: null}
  需求频繁变更:    {kind: 阻碍, index: null}
  技术债:          {kind: 阻碍, index: null}
  测试基建缺失:    {kind: 阻碍, index: null}
  输入不全:        {kind: 阻碍, index: null}
  需求模糊:        {kind: 阻碍, index: null}
  违反教学规律:    {kind: 阻碍, index: null}
  事实不清:        {kind: 阻碍, index: null}
  开发:            {kind: 岗位类, index: {source: 组织架构, query: ["研发团队"]}}

  # ---- 单元类目（引用别的行业单元时：既能写 unit_id，也能写中文行业名）
  dongjiagoushi:    {kind: 单元, label: 软件研发, index: null}
  content-creation: {kind: 单元, label: 内容创作, index: null}
  design-visual:    {kind: 单元, label: 视觉设计, index: null}
  marketing:        {kind: 单元, label: 市场营销, index: null}
  hr-services:      {kind: 单元, label: 人力资源, index: null}

# ---------------------------------------------------------------- 跨单元岗位别名
# 在不同单元里，同一个岗位/同一个类目可能换了名字。收敛到统一 key，避免同一个东西三种叫法。
aliases:
  用户: [最终用户, 用户（人）]
  业务方: [业务执行方]
  跨岗口径不一致: [岗位产物口径不一致导致返工]
  需求频繁变更: [需求仍在变却要求定架构, 需求方中途改口径, 目标不清晰却强推排期]
  技术债: [既有系统债务不可动, 方案与需求打架, 变更过大无法审]
  测试基建缺失: [无测试导致无法判断行为]
  合规风险: [违规话术与虚假宣传, 夸大表述带来合规风险]
  隐私与歧视风险: [触碰隐私与歧视红线]
  越过医疗边界: [越过医疗边界给出诊断结论]
  预算与工期失真: [预算与工期估算失真]
  玩法验证不足: [玩法验证不足导致返工]
  效果不可归因: [效果不可归因导致预算浪费]
  流程遗漏: [流程遗漏导致来回补件]
  输入不全: [只讲好看不讲可用, 违反教学规律, 事实不清即下结论, 口径错一处全表皆错, 口径不一致得出错误结论]
  各执行岗位: [各执行岗位（少扯皮）]
  后续维护者: [后续维护者]
  团队: [团队（少背锅）]
  需求方与文案: [需求方与文案]
  内容创作: [content-creation]
  content-creation: [内容创作]
  事实不清: [事实不清即下结论会误导]
  违反教学规律: [不符合教学规律会适得其反]
