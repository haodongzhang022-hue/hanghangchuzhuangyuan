# ============================================================================
# M11.2 行业类词表（industry-classes）· 目录化汇总入口
# 用途：把「利益链条」里的上下游，从写死的公司名收敛成**行业类目**。
#
# 为什么拆目录：一个文件装全部类目，条目一多就变成一堆同义词的流水账，
#   没人能管、没法分工、也没法按域评审。所以按域拆成
#   data/industry-classes/<域>.yaml，每个文件只装一个 kind 家族的类目；
#   本文件只做「汇总 + 全局口径」，不改数据本身。
#
# 拆完之后，词表可以直接落成数据库表（见 scripts/gen_class_ddl.py），
# 也能被云仓（CNB 知识库）检索到 —— 一个 YAML 是既不查也不管，
# 目录 + 表结构 + 检索层才管得住。
#
# 三层引用（链上写）：
#   industry_class  类目：钢材加工 / 品牌方 / 用人部门 …（本目录，稳定、可复用、可跨行业共享）
#   interface       接口：岗位交接协议面（M5 交接卡、合并门禁、发布渠道 …）
#   role            岗位：本单元或其他单元的岗位名（跨单元在 ref 里带 unit）
#   具体公司        **不进仓库**：靠 index 声明的检索方式去 CRM / 名录 / ATS / 内部主数据现查
#
# 校验：`python3 src/hanghang/cli/main.py role chain --check`
#   - 链上写成了公司形态（XX有限公司 / 某某厂 / XX集团 …）→ FAIL，落库被拦
#   - 类目不在词表 → FAIL，要求先登记类目（防止同义词扩散）
#   - 类目录了但没有索引（index）也没标 alias_of → WARN，说清是"还没接索引"
#   - role 类目在本单元不存在 → WARN（跨域复用允许，但要写 unit）
# ============================================================================
version: "2.0"
updated_at: "2026-10-29"
note: |
  词表按域拆分为 data/industry-classes/*.yaml（supply / demand / delivery /
  internal / institution / blocker / unit）。新增类目请加到对应域文件，
  不要往本文件堆；本文件只放全局口径与汇总引用。

# 公司形态识别（写进画像即视为"把具体公司存进来了"）
company_markers: [有限公司, 有限责任公司, 股份有限公司, 股份公司, 集团公司, 集团, 某某, 某厂, 工厂, 分公司, 子公司]

# ---------------------------------------------------------------- 类目词表（按域汇总）
# 域的划分与 kind 的归属见各文件头部注释。
classes: !include
  - industry-classes/supply.yaml
  - industry-classes/demand.yaml
  - industry-classes/delivery.yaml
  - industry-classes/internal.yaml
  - industry-classes/institution.yaml
  - industry-classes/blocker.yaml
  - industry-classes/unit.yaml

# ---------------------------------------------------------------- 跨单元/跨叫法别名
# 在不同单元里，同一个岗位/同一个类目可能换了名字。收敛到统一 key，避免同一个东西三种叫法。
aliases:
  用户:
    - 最终用户
    - 用户（人）
  业务方:
    - 业务执行方
  跨岗口径不一致:
    - 岗位产物口径不一致导致返工
  需求频繁变更:
    - 需求仍在变却要求定架构
    - 需求方中途改口径
    - 目标不清晰却强推排期
  技术债:
    - 既有系统债务不可动
    - 方案与需求打架
    - 变更过大无法审
  测试基建缺失:
    - 无测试导致无法判断行为
  合规风险:
    - 违规话术与虚假宣传
    - 夸大表述带来合规风险
  隐私与歧视风险:
    - 触碰隐私与歧视红线
  越过医疗边界:
    - 越过医疗边界给出诊断结论
  预算与工期失真:
    - 预算与工期估算失真
  玩法验证不足:
    - 玩法验证不足导致返工
  效果不可归因:
    - 效果不可归因导致预算浪费
  流程遗漏:
    - 流程遗漏导致来回补件
  输入不全:
    - 只讲好看不讲可用
    - 违反教学规律
    - 事实不清即下结论
    - 口径错一处全表皆错
    - 口径不一致得出错误结论
  各执行岗位:
    - 各执行岗位（少扯皮）
  后续维护者:
    - 后续维护者
  团队:
    - 团队（少背锅）
  需求方与文案:
    - 需求方与文案
  内容创作:
    - content-creation
  content-creation:
    - 内容创作
  事实不清:
    - 事实不清即下结论会误导
  违反教学规律:
    - 不符合教学规律会适得其反
