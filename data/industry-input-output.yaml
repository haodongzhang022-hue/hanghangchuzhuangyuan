# ---------------------------------------------------------------------------
# 行业池切分：把"能不能切、按什么锚切"算出来，不填数
#
# 部门层总额是增加值性质，所以池的流入锚点只能是增加值（或经 va_ratio 折算后的
# 增加值）。这份账负责回答「这个池现在能不能切」，切多少由 money 账在拿到锚点后填。
# ---------------------------------------------------------------------------
pool_rules:
  - partition: manufacturing
    anchor: value_added
    benchmark: va-manufacturing
    note: 增加值已在官方基准里，可直接作为切分锚点
  - partition: construction-eng
    anchor: va_ratio
    note: 总产值 31.6 万亿 × va_ratio 0.272 = 8.6 万亿增加值，同基准互印
  - partition: e-commerce
    anchor: none
    note: GMV 不可切，等增加值口径
  - partition: logistics-supply
    anchor: none
    note: 成本总额不可切，等交通运输仓储邮政业增加值
  - partition: healthcare
    anchor: none
    note: 费用总额不可切，等卫生和社会工作业增加值
  - partition: education-training
    anchor: none
    note: 财政口径为主，需先定"财政支出算不算本池流入"
  - partition: finance-invest
    anchor: none
    note: 部门层已按金融部门归集，切到分区会双计
  - partition: dongjiagoushi
    anchor: none
    note: 软件业务收入口径不可比，等信息服务业营业收入
