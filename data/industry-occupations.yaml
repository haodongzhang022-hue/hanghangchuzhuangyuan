  # 第三轮补全：按「交税/付费视角」扫出来的漏统职业
  #   这批量不是为了多建单元，而是把"人"补回画像：谁在干活、谁付钱、
  #   产值怎么算。漏掉的职业会让市场画像缺角（直播打赏刷出几千亿，之前
  #   只登记了一个"新媒体运营"，等于看不见这个行业）。
  #   access 字段见文件头说明；不写 = paid_direct。
  # ==========================================================================

  # ---------------- 直播/电竞/陪玩（数字经济新职业，大典已有编码） ----------------
  # 分区归属各自独立：直播(打赏+坑位) / 电竞(奖金+工资+票务) / 内容创作(MCN 内部职能)。
  # 早前这 5 个职业全塞进一个 esports-live 分区，等于把三种商业模式折叠成一个，
  # 谁跟谁一类都看不出来——现在按付费方和交付物分开挂。
