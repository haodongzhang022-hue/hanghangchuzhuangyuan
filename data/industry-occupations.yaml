  - {code: OCC-000149, id: live-stream-operator, name: 直播运营, deliverable: 服务, provider: hybrid, billing: salary, baseline_occupation: true, note: 选品/排期/场控，属 MCN 内部职能；付费方是机构预算，不是观众打赏，所以挂内容创作而非 live-streaming}
