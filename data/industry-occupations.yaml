# ============================================================================
# 行业分区定义库 · 第一层：occupation（职业）
# 作用：把「职业」作为**解耦的最小单目标**登记，不与行业命名绑定。
#   1) 一个职业可以落在多个行业（如"会计"跨所有行业）；
#   2) 行业分区是 occupation 按产出物/付费来源聚类的结果，见
#      data/industry-partitions.yaml；
#   3) 每个已注册单元的角色(role)用 unit_role 字段反查到这里；
#   4) 已注册单元尚未覆盖的 baseline_occupation 由 coverage 计入「职业覆盖进度」。
#
# 字段说明（**只加不改，避免数据膨胀失焦**）：
#   id        职业标识(kebab-case，稳定主键，不随行业命名变化)
#   name      职业名
#   unit_id   已承接该职业的行业单元ID；空缺 = 尚未建单元（覆盖缺口）
#   unit_role 该单元内承接此职业的岗位名(roles[].name)；与 unit_id 同步
#   deliverable 交付物类型(文本/代码/方案/物料/服务/决策/实物/程序)
#   provider  提供者类型：human / ai / hybrid
#   billing   收费方式：subscription(订阅) / hourly(计时) / project(项目) / commission(佣金)
#             / retainer(顾问) / usage(按次) / salary(雇员工资) / free(免费/公共) / licensing(授权)
#   baseline_occupation
#             是否列入覆盖分母（true=当前目标基线）。目标全集刻意收敛，
#             避免把 1636 个细类职业全塞进来把覆盖率稀释成 meaningless 的数字。
#   note      备注
#
# 基线口径：GB/T 6565《职业分类大典》中类 + 高频"可被数字员工承接"的服务场景。
# 新增职业只需追加一行；新增行业分区只需在 partitions 里加一条聚类规则。
# ============================================================================
