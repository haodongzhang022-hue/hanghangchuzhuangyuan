# ============================================================================
# 行业分区定义库 · 第一层：occupation（职业）
# 作用：把「职业」作为**解耦的最小单目标**登记，不与行业命名绑定。
#   1) 一个职业可以落在多个行业（如"会计"跨所有行业）；
#   2) 行业分区是 occupation 按产出物/付费来源聚类的结果，见
#      data/industry-partitions.yaml；
#   3) 每个已注册单元的角色(role)用 unit_role 字段反查到这里；
#   4) 已注册单元尚未覆盖的 baseline_occupation 由 coverage 计入「职业覆盖进度」。
#
# 字段说明（**只加不改，避免数据膨胀失焦**）：
#   id        职业标识(kebab-case，稳定主键，不随行业命名变化)
#   name      职业名
#   unit_id   已承接该职业的行业单元ID；空缺 = 尚未建单元（覆盖缺口）
#   unit_role 该单元内承接此职业的岗位名(roles[].name)；与 unit_id 同步
#   deliverable 交付物类型(文本/代码/方案/物料/服务/决策/实物/程序)
#   provider  提供者类型：human / ai / hybrid
#   billing   收费方式：subscription(订阅) / hourly(计时) / project(项目) / commission(佣金)
#             / retainer(顾问) / usage(按次) / salary(雇员工资) / free(免费/公共) / licensing(授权)
#   baseline_occupation
#             是否列入覆盖分母（true=当前目标基线）。目标全集刻意收敛，
#             避免把 1636 个细类职业全塞进来把覆盖率稀释成 meaningless 的数字。
#   note      备注
#
# ---- 以下字段是「补全与视角分离」改造新增（字段只加不改，老数据无需回填）----
#   access    需求侧承接通道，说明"这个职业靠什么和付费方接上"。默认现金市场直连
#             （字段留空即 paid_direct）；非默认值必须显式写上：
#               paid_direct  服务本身在市场上直接收费（默认）
#               non_market   服务由财政/公共预算供养，终端用户不直接付费（军人/消防/
#                            社区服务/政务窗口）。它**本身就是购买力**（财政采购），
#                            不是"难付费"，所以照样进覆盖分母，只是需求侧走采购通道
#               org_internal 企业内部职能（行政/前台/薪酬核算），产值计入主业，
#                            无独立市场口径，需求侧是雇主预算
#               household    家庭内部无酬劳动（家务/育儿/照护自己的家人），无现金交易，
#                            但占实际劳动时间、构成家政/养老/托育市场的替代基准
#   axis      （分区上）这个词在哪个视角下成立。**同一个 partition 可以被多根轴
#             引用**，所以「多视角」不等于「多建分区」：
#               occupation_axis  干活的人（数字员工是否承接这个职业）。默认
#               industry_axis    卖东西的单位（GB/T 4754 行业口径、产值统计归口）
#               tax_axis         钱按什么税目征（跟"卖的是什么"走，不跟行业走）
#               output_axis      一年多大产值、多少人就业
#             example: 露天采矿工 → 职业轴上成立（有雇主、有作业流程），
#             行业轴上归 B 采矿业，tax_axis 跟矿石货物 13% 走，output_axis 走采矿业增加值。
#             所以"采矿工不该被忽略"与"不必为采矿工建数字员工单元"并不矛盾：
#             人留在画像与需求侧，单元按 AI 承接面另判。
#
# 大典编码在哪：本文件**不**存 gb_code。职业 ↔《职业分类大典（2022 年版）》细类码的
#   映射单独放 data/reference/occupation-gb-map.yaml，理由：
#   1) 大典是外部标准，会换版（2015→2022），映射要能整份替换而不动业务字段；
#   2) 147 条里只有 70 条口径对得上，把空字段铺满本文件只是噪音；
#   3) 查表用 `industry catalog --search 关键词`，补职业时先看标准里叫什么，
#      别现编名字——这是"造词/重名/粒度乱跳"的根治法。
#
# 基线口径：GB/T 6565《职业分类大典》中类 + 高频"可被数字员工承接"的服务场景。
#   注意 baseline_occupation 的分母刻意收敛在 139，不随大典 1636 条膨胀，
#   否则覆盖率会被稀释成没有意义的数字。
# 新增职业只需追加一行；新增行业分区只需在 partitions 里加一条聚类规则。
# ============================================================================
