# ============================================================================
# 行业分区定义库 · 第二层：partition（行业分区 = 职业聚类结果）
#
# 设计立场（关键）：
#   **职业是解耦的最小单目标，行业是聚类的结果。**
#   所以本文件不"定义行业"，只记录「某一组职业为什么被聚在一起」：
#     - 聚类依据 cluster_basis（交付物同源 / 付费方同行 / 技能栈重叠 / 交付链上下游）
#     - 谁付钱 demand_side（付费方 = 需求侧）
#     - 谁提供 provider_mix（人类/混合/AI 各自供给比重）
#     - 这个分区在中国市场的年度规模产值_gdp_cny（口径：行业口径总产值/营业收入）
#   命名变化只改 name / aliases，不动 members（职业 id），因此不会被命名方式影响。
#
# 字段说明：
#   id            分区标识(=未来/现有 unit_id 一致性对齐键)
#   name          分区名（可改，非主键）
#   aliases       其它叫法（旧名/口语/英文，仅用于检索对齐）
#   cluster_basis 聚类依据
#   demand_side   付费方/需求侧（谁付钱）
#   provider_mix  供给结构：{ai, hybrid, human} 占比，和为 100
#                 契约是"成员职业 provider 实测"：已建/待建分区按实测回填；
#                 无成员职业的分区一律 {ai:0, hybrid:0, human:0}（没有值就是 0，不是估算）。
#   provider_mix_estimated  人工估算值留档（对账用，不参与展示）；
#                 无成员分区只在这里放估算，别塞回 provider_mix 冒充实测。
#   planned_roles 岗位命名骨架（待建分区专填）：单元未建时 unit_role 可空，
#                 一旦填了就必须落在这份骨架里，防止建单元时随手编角色名。
#   gdp_cny       年产值(元, 中国口径, 约占该产业规模)；null = 未可靠估算（禁止编造）
#   gdp_scope     产值口径说明（人话，给评审看）
#   gdp_source    来源/估算方法
#   gdp_kind      ★产值口径类型（机器可读，排序/汇总先按它分组）：
#                   value_added  增加值（GDP 口径，可相互加总、可与国家统计局对表）
#                   gross_output 总产值/总产出（含中间投入，加总会重复计算）
#                   revenue      营业收入/行业收入（企业口径，含中间投入）
#                   market_size  市场规模（第三方测算，范围常与统计口径不同）
#                   cost_total   成本总额（物流费用/R&D 经费，本身就是投入不是产出）
#                   gmv          交易额/流水（电商零售额、直播打赏，非增加值）
#                   none         无市场口径（刻意留空，gdp_cny 必为 null）
#                 加总只允许同口径相加：把 GMV 和增加值加在一起，数字越大越误导。
#   gdp_confidence 口径置信度 high / medium / low（无 gdp_cny 时省略）：
#                 高 = 官方统计直接可取；中 = 官方总额按分项拆分或行业报告；
#                 低 = 第三方测算或量级拍脑袋 —— 低置信的数不参与对外引用。
#   employment    该分区从业人员规模(万人，量级参考)；null/缺省 = 无可靠口径
#   employment_source 就业口径来源
#   unit_id       已承接该分区的注册单元（空=未建单元）
#   priority      推进优先级
#   channels      数据来源渠道（获取数据的路径，不只是补岗位）
#   access_sides  该分区职业的承接通道构成（缺失时按成员职业 access 字段实测）
#                 现金市场 / 非市场(财政) / 企业内部 / 家庭无酬 —— 用来区分
#                 "没有付费方" 和 "付费方不是终端用户"，两者完全不是一回事
#   status        covered(已有单元) / pending(待建单元) / evaluated(不建数字员工单元)
#                 ★ evaluated 不等于"忽略"：职业照样登记、画像照样统计、产值照样
#                   计入输出轴，只是不从"数字员工单元"这条产品线建单元。
#                   从根上消灭"评估完就悄悄从分母里消失"这条路。
#   note
#
# ---------------------------------------------------------------------------
# 多视角 ≠ 多轴：一个分区可以被多根轴同时引用
#
#   职业轴 occupation_axis  这个分区里的人在干什么活（数字员工接不接得住）
#   行业轴 industry_axis    这家单位在卖什么（GB/T 4754 口径、产值统计归口）
#   税收轴 tax_axis         这笔钱按什么税目征（跟交付物走，不跟行业走）
#   产出轴 output_axis      一年多大产值、多少人就业（gdp_cny + employment）
#                           两根数字同源不同义：有人没产值的分区（军队/家庭无酬）
#                           同样要算就业——"多少人吃饭"本身就是市场画像。
#
# 所以"主播/陪玩要补进来"和"采矿工/军人要补进来"是同一件事的两面：
# 前者是之前口径漏了（只看传统服务名录就会漏掉直播打赏），
# 后者是之前被"能不能直接付费"这一个过滤器错误地丢掉了。
# 正确做法是：职业一律登记，用 access 区分承接通道，用 axis 说明在哪个视角成立，
# 再由 status 单独回答"要不要建数字员工单元"——四件事，别压成一个判断。
#
# 产值免责：gdp_* 为"量级参考"而非官方统计，用于给分区排序定权重，
#           不可用于对外发布；校准以国家统计局分行业增加值/营业收入为准。
# ============================================================================
