# ============================================================================
# 行业分区定义库 · 第二层：partition（行业分区 = 职业聚类结果）
#
# 设计立场（关键）：
#   **职业是解耦的最小单目标，行业是聚类的结果。**
#   所以本文件不"定义行业"，只记录「某一组职业为什么被聚在一起」：
#     - 聚类依据 cluster_basis（交付物同源 / 付费方同行 / 技能栈重叠 / 交付链上下游）
#     - 谁付钱 demand_side（付费方 = 需求侧）
#     - 谁提供 provider_mix（人类/混合/AI 各自供给比重）
#     - 这个分区在中国市场的年度规模产值_gdp_cny（口径：行业口径总产值/营业收入）
#   命名变化只改 name / aliases，不动 members（职业 id），因此不会被命名方式影响。
#
# 字段说明：
#   id            分区标识(=未来/现有 unit_id 一致性对齐键)
#   name          分区名（可改，非主键）
#   aliases       其它叫法（旧名/口语/英文，仅用于检索对齐）
#   cluster_basis 聚类依据
#   demand_side   付费方/需求侧（谁付钱）
#   provider_mix  供给结构：{ai, hybrid, human} 占比，和为 100
#   gdp_cny       年产值(元, 中国口径, 约占该产业规模)；null = 未可靠估算（禁止编造）
#   gdp_scope     产值口径说明
#   gdp_source    来源/估算方法
#   unit_id       已承接该分区的注册单元（空=未建单元）
#   priority      推进优先级
#   channels      数据来源渠道（获取数据的路径，不只是补岗位）
#   status        covered(已有单元) / pending(待建单元) / evaluated(仅评估不建单元)
#   note
#
# 产值免责：gdp_* 为"量级参考"而非官方统计，用于给分区排序定权重，
#           不可用于对外发布；校准以国家统计局分行业增加值/营业收入为准。
# ============================================================================
