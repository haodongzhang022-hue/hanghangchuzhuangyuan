note: >
  由 industry-partitions 的 pending 分区 agriculture 建单元（农林牧渔业增加值 9 万亿，
  value_added 口径）。分区 note 无特殊约束，但战略视图点明：
  「AI 给建议，农时判断和用药责任必须由懂这块地的人定」——
  所以触发词覆盖病虫害/茬口/饲喂等现场动作，而非泛化的「农业」二字。
