note: >
  由 industry-partitions 的 pending 分区 construction-eng 建单元（建筑业总产值 32 万亿）。
  该分区是全库唯一「生产法恒等式闭合」的账（总产值 31.6 万亿 = 增加值 8.6 万亿 +
  中间投入 23.0 万亿，va_ratio 0.272），战略视图点名「利润不在算量，在增项与材料差」——
  这条判断正是 AI 上岗最需要的，触发词据此覆盖增项/变更签证/材料差等环节。
  触发词取自该分区 aliases / 价值链 / AI 承接面，不凭想象补。
