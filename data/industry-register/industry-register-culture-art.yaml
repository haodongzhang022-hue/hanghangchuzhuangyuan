note: >
  由 industry-partitions 的 pending 分区 culture-art 建单元（文化艺术增加值 1 万亿，
  value_added 口径）。
  与 video-media 的边界：文化艺术是展览/演出/出版/音乐这类**非影视**内容；
  影视制作与剪辑在 video-media，直播与带货在 live-streaming。
  战略判断：「AI 出初稿，版权与署名责任归人」。
