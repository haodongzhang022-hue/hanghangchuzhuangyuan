note: >
  由 industry-partitions 的 pending 分区 esports 建单元（产值口径缺失，刻意留空）。
  与 live-streaming 的拆分立场：电竞付费方是赛事奖金+俱乐部工资+票务赞助，
  交付是竞技成绩与赛事产品；直播是观众打赏+品牌坑位。两者共用一份钱是把两种
  商业模式捏成一个，所以电竞产值不并入直播的 2000 亿。
  与 sport-games 的边界：体育赛事是线下票务赞助，电竞是竞技内容与俱乐部。
