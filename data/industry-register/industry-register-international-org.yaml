  gdp_kind=none）——不填 0 冒充数据，这条与本仓其它留空分区一致。
  原判定「雇方是机构预算、无市场付费口径」仍成立，所以本单元不产出规模账，
  只提供能力面：议题背景与文件起草、多语言翻译与校对、项目报告与指标整理。
  战略边界：谈判立场、授权与承诺、对外表态由人担（见 ai_weak）。
  跨分区协作：多语言翻译走 translation 单元，本单元只管涉外事务本身。
