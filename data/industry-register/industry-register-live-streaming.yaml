note: >
  由 industry-partitions 的 pending 分区 live-streaming 建单元（2000 亿，gmv 口径，
  priority=高）。
  分区 note 是一条重要告诫：「这个行业 2020 年后规模已超过多数传统文化行业，但只看
  企业名录/国民经济行业分类就会整个漏掉——它挂在互联网信息服务下面，不独立成行」。
  所以别因为它在标准分类里没有独立编号就当它不重要。
  拆分立场：直播付费方是观众打赏+品牌坑位，电竞是赛事奖金+俱乐部工资，两者共用
  一份 2000 亿是把两种商业模式捏成一个；本单元只承接直播，电竞在 esports 分区。
