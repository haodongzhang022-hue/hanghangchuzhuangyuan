note: >
  由 evaluated 转为 covered（矿业资源，增加值 5 万亿，medium）。
  **AI 边界必须写死**：分区原判定是「AI 承接面窄（现场作业为主）」，
  这条没有变——本单元只承接采矿设计、配矿、地质资料、安全巡检记录、
  选矿参数这类**文档与计算**工作；井下/露天现场作业（爆破、支护、装载）
  明确标 composite=false，AI 不介入。
  「现场作业、安全与爆破责任、储量签字」三项由人担，见战略视图 ai_weak。
