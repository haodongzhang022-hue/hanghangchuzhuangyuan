note: >
  新增分区「市政公用建设」：把市政建设的**建设侧**从 utilities（运营侧）分出。
  两者都涉及水电气，但一个是建管网、一个是跑运营，甲方与岗位完全不同。
  与 construction-eng 的边界：房建与通用土建走那边，本分区只做市政管线与厂站。
  AI 边界：地下管线判断、施工拍板、验收签字必须由人到现场。
