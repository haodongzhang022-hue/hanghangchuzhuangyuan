note: >
  由 industry-partitions 的 pending 分区 public-affairs 建单元（产值刻意留空：
  行政办公/政务公共这类无市场口径的分区留 null，不填 0 冒充数据）。
  承接通道多为 non_market（财政供养）—— 项目立场是「不直接付费 ≠ 不值得分析」，
  军警消防社区工作者都在这里，画像照样统计。
