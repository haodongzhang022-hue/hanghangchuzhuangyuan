register_version: '1.0'
note: >
  由 evaluated 转为 covered（安防市场规模 1 万亿，market_size，confidence=low）。
  **这是最需要守边界的一个单元**：分区原判定是「军队/消防的核心交付是到场与担责，
  AI 承接面窄且越界风险高——给出预案建议可以，替代到场不行」。
  所以本单元只承接三类脑力/文档工作：
    emergency_planner（预案、演练脚本、风险台账、隐患分级）
    security_officer（安防方案、门禁流程、访客管理）
    civilian_staff_mil（部队文书与后勤管理支持）
  firefighter / military_officer / soldier 三个岗位 composite=false，
  明确写死「AI 不介入现场处置与指挥」。
  「不直接付费 ≠ 不值得分析」：这些人群 leave 在画像里，是 non_market 通道的样本。
