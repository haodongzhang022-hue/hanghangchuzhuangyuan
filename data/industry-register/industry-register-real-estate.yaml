note: >
  由 industry-partitions 的 pending 分区 real-estate 建单元（1.5 万亿，revenue 口径）。
  分区 baseline 状态是 unlinked，原因写着「年鉴有门类口径但分区范围与之不对应
  （房地产含开发/物业/中介，分区只取一段）」，等口径能一对一映射再接 —— 如实继承。
  触发词覆盖经纪/置业/评估/招商/物业五段，不含泛化的「房产」二字以外的共享词。
