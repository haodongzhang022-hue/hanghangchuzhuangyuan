note: >
  由 industry-partitions 的 pending 分区 research-academic 建单元（R&D 经费中外部
  服务部分 2.5 万亿，cost_total 口径 —— 成本总额不是增加值）。
  分区 note：「与数据分析/软件研发高度复合，学界伦理边界需单列」。
  战略边界：「AI 做检索与草稿，数据真实性和署名责任不可让渡」——
  触发词覆盖文献/申报/实验/分析/编辑五段，不含泛化的「科研」二字。
