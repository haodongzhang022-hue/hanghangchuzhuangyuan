roles:
- name: literature_reviewer
  prefix: '[文献]'
  handoff: relay
  composite: true
  description: 文献综述 查新 文献检索 综述撰写
  keywords:
  - 文献综述
  - 文献检索
  - 查新
  - 综述
  - 参考文献
  - 引文
  - 研究现状
- name: grant_writer
  prefix: '[申报]'
  handoff: relay
  composite: true
  description: 课题申报 基金本子 立项 预算
  keywords:
  - 课题申报
  - 基金本子
  - 项目申报书
  - 立项
  - 研究计划书
  - 经费预算
  - 国自然
  - 标书撰写
- name: experiment_designer
  prefix: '[实验]'
  handoff: relay
  composite: true
  description: 实验设计 对照 样本量 变量控制
  keywords:
  - 实验设计
  - 对照组
  - 样本量
  - 变量控制
  - 实验方案
  - 重复实验
  - 显著性
- name: research_analyst
  prefix: '[科研分析]'
  handoff: relay
  composite: true
  description: 科研数据分析 统计 建模 复现
  keywords:
  - 科研数据
  - 统计分析
  - 数据处理
  - 复现
  - 回归模型
  - 数据清洗
- name: academic_editor
  prefix: '[学术编辑]'
  handoff: relay
  composite: true
  description: 学术编辑 论文润色 格式 投稿 审稿意见
  keywords:
  - 论文润色
  - 投稿
  - 审稿意见
  - 论文格式
  - 期刊
  - 查重
  - 返修
  - 学术编辑
# 兼做岗位（weight=0.30）：专利代理人在本分区只承接「科研成果转化」这一小段。
