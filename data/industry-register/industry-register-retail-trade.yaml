note: >
  2026-11-18 新增分区「零售贸易」，与 e-commerce 分列：
  e-commerce 装网上零售额 15 万亿（GMV），本单元装门店与全渠道实体零售。
  两者付费方同为终端消费者，但交付方式（到场 vs 履约到家）与岗位能力面完全不同。
  产值**刻意留空**：社零 47.15 万亿含网上零售，取它会与 e-commerce 重复计——
  等拿到「限额以上零售业增加值」这类独立口径再填。
  战略判断：零售的利润池在商品企划与陈列，不在到店成交那一下。
