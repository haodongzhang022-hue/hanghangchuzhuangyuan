note: >
  由 industry-partitions 的 pending 分区 sport-games 建单元（体育产业总产出 3 万亿，
  gross_output 口径）。分区 note 明确：「产值 3 万亿是**体育产业整体**口径，
  保留在这里只是为了让产出轴有个锚点，不代表本分区独占」——
  这条要如实继承，别在本单元里声称独占 3 万亿。
  与 esports 分区的区别：赛事是票务/赞助/场馆，电竞是竞技内容与俱乐部。
