register_version: '1.0'
note: >
  新增分区「检测认证」，把商业检测从 research-academic（科研经费侧）里独立出来：
  付费方（企业合规 vs 财政科研经费）、交付（带效力的报告 vs 论文）、
  责任（对结论担责 vs 署名与可复现）完全不同。
  **AI 边界写死**：报告签发与法律担责由持证授权签字人签，AI 只出初稿与数据整理。
  provider_mix 按成员职业实测（20/80），不按主观预期写——这条被校验拦过一次。
