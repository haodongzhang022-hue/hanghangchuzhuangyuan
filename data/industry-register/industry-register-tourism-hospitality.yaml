register_version: '1.0'
note: >
  由 industry-partitions 的 pending 分区 tourism-hospitality 建单元（旅游业总收入
  5 万亿，gross_output 口径，含住宿/餐饮/景区，与餐饮有重叠）。
  分区 note 已登记该重叠，不强行拆；本单元只承接出行服务侧。
  战略判断：「AI 排行程出文案，现场出问题时只有人能救场」——
  触发词覆盖行程/酒店/民宿/导游/票务/网约车六个真实环节。
