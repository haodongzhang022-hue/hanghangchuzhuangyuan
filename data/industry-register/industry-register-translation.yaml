  # 通用笔译动作：不写在 alias 里会输给「合同/协议」这类法律强词。
  # 实测「帮我翻译这份合同」在只放 alias 时 legal 3.5 > translation 2.0，
  # 因为「合同」同时是 legal 的 alias(2.0)+岗位词(1.5)，而「翻译」仅 alias(2.0)。
  # 「翻译」是交付动作本身，归到笔译岗位的触发词才符合实际语义。
