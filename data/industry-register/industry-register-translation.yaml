note: >
  由 industry-partitions 的 pending 分区 translation 建单元。
  只放**异步文本交付**（笔译/字幕/本地化）；口译在 interpretation 分区，
  AI 承接面差一个量级，混在一起会把「AI 替代率最高」的结论套到同传头上。
  触发词取自该分区 aliases / demand_side / 战略视图的 AI 承接面与价值链环节，
  不凭想象补：words 都对应一个真实环节或真实诉求。
