note: >
  新增分区「交通基建」：把公路/铁路/机场/港口从 construction-eng（房建与通用施工）分出。
  结构物类型（线形/桥隧/轨道）、甲方（交通局与平台公司）、验收规范完全不同。
  与 water-marine 的边界：水工结构走 water-marine。
  AI 边界：结构签章、地质判断、计量确认由注册人员签。
