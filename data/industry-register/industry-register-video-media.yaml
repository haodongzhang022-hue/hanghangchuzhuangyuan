register_version: '1.0'
note: >
  由 industry-partitions 的 pending 分区 video-media 建单元（广播电视与网络视听
  行业收入 2.5 万亿，revenue 口径，priority=高）。
  分区 note 指出：官方无独立产业增加值口径（影视挂在「文化及相关产业」下不单列），
  规模来自行业协会年报。这一点要如实继承，不要在本单元里假装有官方口径。
  战略判断：成本前置、回收滞后；AI 渗透最快的是后期与特效，人守剧本终稿与审片合规。
  触发词据此覆盖剪辑/摄影/后期/编剧/场记五个真实环节。
