# ============================================================================
# 行业规模账 · 六口径槽位（industry-scales）
#
# 为什么要有这份文件：
#   一个行业**不该因为产值没统计就整体隐身**。产值（增加值）是最难拿的一格，
#   全国只有约 20 个门类有官方增加值；但同一个行业还有别的痕迹——利润总额、
#   资产总计、上市板块市值、从业人数、能耗水耗。只要**任一口径有数**，
#   这个行业就还在表里，能排序、能比较、能进分母。
#
# 六个口径（同一批钱的六个侧面，不是"更精确的同一个数"）：
#   gdp         年产值/增加值   ← 读 partition.gdp_cny + gdp_kind（单一来源，不在此重复存）
#   employment  从业人数        ← 读 partition.employment（单一来源）
#   profit      盈利规模        ← 本文件
#   asset       资产规模        ← 本文件
#   valuation   估值规模        ← 本文件
#   resource    资源消耗        ← 本文件（实物量 + 单位，不折算成钱）
#
# 三条规矩（与本仓库 gdp_cny 同源）：
#   1. **没有口径就不填数字。** 缺了就在 missing 里写原因，null 不等于 0。
#   2. **不重复存。** gdp / employment 已挂在 partition 上，这里只补另外四个；
#      同一件事存两份，迟早对不上，而且没人知道哪份是对的。
#   3. **资源消耗保留实物单位。** 把"耗电 800 亿度"折成人民币要选电价，
#      一选就把实测变成估算。单位合法值：tce（吨标煤）/ kwh / ton / ton_water /
#      m3 / gwh。
#
# 交叉验证（抓数量级错，不抓行业差异）：
#   利润 ÷ 产值 超出按口径分档的窗口、产值 ÷ 人数 超窗口、估值 PE/PS 超窗口、
#   资产比利润还小三个数量级 —— 报错。这类错「每个数单看都对，加起来才不对」，
#   只能靠两个独立来源互推。
#
# 产值免责：所有数值为**量级参考**，用于排序定权重与交叉验证，
#           不可对外发布；校准以国家统计局/行业主管部门口径为准。
# ============================================================================
version: "0.1"
updated_at: "2026-11-15"
year_basis: 2023-2024
unit: CNY
#
# 字段：
#   partition      分区 id（= industry-partitions.yaml 的 id）
#   profit         {cny: 元, basis: 口径说明, source: 来源, confidence: high|medium|low}
#   asset          同上
#   valuation      同上（上市板块总市值 / 一级市场估值）
#   resource       {value: 实物量, unit: 见上, basis: 口径, source:, confidence:}
#   missing        {metric: 为什么这一格是空的} —— 把"没数据"写成可校验的句子
#   note
#
# 每个分区都必须在这里出现一次（有数就写数，没数就写 missing 原因）：
# 漏掉一个分区 = 这个行业在六口径视角里没有任何落点，validate 会报。
# ============================================================================
