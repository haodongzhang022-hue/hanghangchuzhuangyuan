# ============================================================================
# 行业战略视图 · 大局观与战略视角（industry-strategy）
#
# ## 一句话
#
# **粒度红线：细到岗位（position）和角色（role）就停，不往下拆。**
# 再细的东西——具体工序、话术、提示词、逐条职责——不写在数据里，那是 AI 上到
# 那个岗位、认清职责之后自己充当角色时补的。**我们是分工的**：
#
#     人（这份文件）      这一行行业的钱在哪、谁有定价权、什么在驱动、什么会杀死它
#     岗位 / 角色（已有）  unit-index 的 roles + planned_roles，谁在哪个环节干活
#     AI（上岗时补）      职责展开、工序、话术、判定标准、异常处理
#
# 所以这份账回答的不是"这个岗位怎么干"，而是**"这个行业凭什么赚钱、AI 该站哪一段"**。
# 岗位是解耦的最小单位，行业是聚类结果（见 industry-partitions.yaml）；
# 战略视图是聚类的**判断结论**，不是又一层更细的拆分。
#
# ## 为什么要有这一层
#
# 41 个分区现在都有产值口径、六口径落点、生产法解释、资金流位置 —— 全是"多少钱"，
# 没有一句"这钱为什么在这、拿什么去挣"。缺这一层的直接后果：AI 被派到
# 「建筑工程-造价员」岗位上，它知道要算量，但不知道这个行业的利润根本不在算量，
# 而在增项与材料差；它会认认真真把一个不赚钱的环节做到极致。
#
# ## 几条硬规矩（validate 第 26 条逐条守）
#
# 1. **每个分区都要有落点**：漏一个 = 这个行业只有数字没有判断，而覆盖率不会变红。
# 2. **粒度红线**：出现 steps / tasks / sop / prompt / kpi / persona 这类字段即报。
#    写在这里就等于把 AI 该干的活提前写死，而写死的那一版永远比市场慢半年。
# 3. **不抄数字**：战略层不重复存产值/就业/利润额（那是 partition + 六口径账的事）。
#    同一件事存两份，迟早对不上，而且没人知道哪份对。
# 4. **role_focus 必须落在本分区真实存在的岗位/角色上**：已建单元对 unit-index 的
#    roles，待建分区对 planned_roles。战略落不到岗位，就等于一句没有人负责的口号。
# 5. **空段要写 missing 原因**：说不出这一行业缺什么，等于保证它永远缺。
#
# 字段（只加不改）：
#   value_chain    价值链分段（>=3 段，顺序即上下游）
#   position       议价位置：这个行业整体在链条上靠什么换钱
#   profit_pool    利润池 [{where, why}]：钱真正沉在哪几段、为什么
#   leverage       杠杆/定价权来源（牌照、网络密度、IP、资质…）
#   drivers        增长驱动（需求侧与技术侧各是什么）
#   risks          能杀死这门生意的风险（不是"竞争激烈"这类废话）
#   ai_frontier    {strong, weak, boundary}：AI 现在站得住 / 站不住 / 边界的判据
#   division_of_labor {human_decides, ai_fills}：人管什么、AI 补什么（只到角色）
#   role_focus     承载战略结论的岗位/角色（必须真实存在）
#   missing        {段名: 为什么这一段落不了}
# ============================================================================
