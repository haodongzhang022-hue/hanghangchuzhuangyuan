  - AI 编码压缩人力投入
  risks:
  - 按人月计价被 AI 压价
  - 需求方自己用 AI 做
  - 交付质量事故一次毁年框
  ai_frontier:
    strong:
    - 方案编写与拆解
    - 代码实现与评审
    - 测试用例与回归
    weak:
