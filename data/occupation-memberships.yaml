# ============================================================================
# 行业分区定义库 · 第三层：membership（职业 × 视角 的边）
#
# 这张表就是「软归属」的全部内容：原子岗位（occupation）没有被写死在任何分区里，
# 它们只是在各种视角下被引用，每条边带一个权重。
#
#   一个职业可以同时落在任意多个分区里，权重不必相加为 100：
#   0.6 + 0.5 不是错误，是「两件活都真干」。分类是筛选器，不是户籍。
#
# 字段：
#   occupation  职业 slug（不是编号；编号只用于跨表对齐，见 OCC-######）
#   partition   视角 key（分区 id；与注册单元同名时表示该单元就是它的执行体）
#   axis        occupation / industry / tax / output，说明这是哪根轴上的看法
#   weight      (0, 1]，这份看法的分量。同轴同分区只保留一条
#   unit_role   该视角下的岗位名（建了单元才需要，用来把路由打到具体岗位）
#   profile     可选：写在 occupation 里也行（职业内去重，一个职业一条）
#
# 本表由 `python3 src/hanghang/cli/main.py industry profile --out ...` 生成/导出，
# 当前内容是从旧单值 unit_id 一次性迁移来的（weight 全 1.0，axis 默认职业轴）。
# 手工加一条边 = 给这个职业多一个被这个视角看见的理由，不改职业本身。
# ============================================================================
