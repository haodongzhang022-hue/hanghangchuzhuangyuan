# ============================================================================
# 职业 ↔《职业分类大典（2022 年版）》细类编码映射（人工核对，宁缺勿错）
#
# 作用：给 data/industry-occupations.yaml 里的职业挂上国家职业分类编码，
#   双向可查：从我们的职业反查大典类目归属；从大典侧看哪些细类职业还没有
#   对应的行业单元（补全缺口时照表挑，不用凭记忆编名字、也不会重复造词）。
#
# 原则：
#   1. 只登记**口径对得上**的映射。我们的职业名很多比大典细类更细或更粗
#      （"品牌策划"、"新媒体运营"、"关卡设计师" 在大典里没有对应细类），
#      这类一律留空 —— 错挂比不挂坏得更彻底。
#   2. 一个职业只挂一个 code（单值外键）。多个我们的职业可指向同一 code
#      （翻译/口译员/字幕翻译 都归「翻译」），反向统计按 code 去重，不虚增。
#   3. confidence: exact=与大典细类同名；near=语义等价的近义名。
#
# 校验：industry check 验证每个 code 真实存在且注释名与目录一致；
#       tests/test_occupation_catalog.py 守住存在性与映射率下限。
# ============================================================================
