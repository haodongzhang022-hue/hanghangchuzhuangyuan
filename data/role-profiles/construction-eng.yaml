            name: 隐患上报
            playbook: 发现隐患停止作业并上报
            outputs:
            - 隐患上报单
            verify:
            - 隐患已上报且作业已停
            runtime: agent
  stakeholders:
    upstream:
    - 各执行岗位
    downstream:
    - 各执行岗位
    beneficiaries:
    - 需求方
