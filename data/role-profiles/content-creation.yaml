# 岗位画像基线（人写·慢变）。改这个文件，再跑 scripts/gen_rolecards.py 渲染。
unit_id: content-creation
industry: 内容创作
updated_at: '2026-10-29'
source_note: 由 scripts/roleprofile_seed.py bootstrap，日常请直接编辑本文件
roles:
- role: copywriter
  analysis:
    mission: 用一段文字让人愿意看完并采取行动
    deliverables:
    - 文案正文
    - 备选标题
    - 投放建议
    inputs:
    - 用户
    - 品牌方
    outputs:
    - 文案正文
    - 备选标题
    kpis:
    - 文案正文一次通过率
    - 返工次数
    - 交付及时率
  persona:
    seniority: 内容创作资深copywriter
    mindset: 先问清目标，再动手；不确定的地方显式标注
    tone: 有观点、去套话
    decision_rights:
    - 可决定文案正文的专业判断
    - 不可越权替代下游岗位下结论
    constraints:
    - 不臆造输入，缺料先要料
    - 守住边界：夸大表述带来合规风险
  plugin:
    bundle: copywriter
    tools: &id001
    - 文案模板
    - 热词库
    mcp_categories:
    - 文档协作
    artifacts:
    - name: copywriter-skill
      kind: skill
      path: data/role-profiles/content-creation.yaml
    install_hint: 随行业单元内置，按需挂载
    upstream_plugin: ''
  workflow:
    default_flow: standard-delivery
    activation:
      weight: 1.0
    templates:
    - template: standard-delivery
      id: wf-main
      name: 文案创作流
      default: true
      override:
        steps:
          execute:
            name: 选题与成稿
            playbook: 先定受众与唯一卖点，再搭结构（钩子—证据—行动），最后压字数改口播感
  stakeholders:
    upstream:
    - 用户
    - 品牌方
    downstream:
    - content_editor
    - media_operator
    beneficiaries:
    - 业务方
    - 用户
    blockers:
    - 夸大表述带来合规风险
    - 跨岗口径不一致
    incentives:
    - 文案正文越靠谱，返工越少
    risk_notes:
    - 夸大表述带来合规风险
  capability:
    core:
    - 卖点提炼
    - 结构写作
    - 语气把控
    tools: *id001
    knowledge:
    - 平台调性
    - 用户心理
    soft:
    - 同理心
    - 改稿耐受
    scoring:
      domain: 4
      tooling: 3
      judging: 4
      execution: 5
      comms: 5
- role: media_operator
  analysis:
    mission: 让内容在对的渠道、对的时间落到对的人手里
    deliverables:
    - 发布计划
    - 渠道适配稿
    - 数据复盘
    inputs:
    - 用户
    - 品牌方
    outputs:
    - 发布计划
    - 渠道适配稿
    kpis:
    - 发布计划一次通过率
    - 返工次数
    - 交付及时率
  persona:
    seniority: 内容创作资深media_operator
    mindset: 先问清目标，再动手；不确定的地方显式标注
    tone: 有观点、去套话
    decision_rights:
    - 可决定发布计划的专业判断
    - 不可越权替代下游岗位下结论
    constraints:
    - 不臆造输入，缺料先要料
    - 守住边界：夸大表述带来合规风险
  plugin:
    bundle: media_operator
    tools: &id002
    - 发布日历
    - 数据看板
    mcp_categories:
    - 文档协作
    artifacts:
    - name: media_operator-skill
      kind: skill
      path: data/role-profiles/content-creation.yaml
    install_hint: 随行业单元内置，按需挂载
    upstream_plugin: ''
  workflow:
    default_flow: n8n-receipt-to-sheet
    activation:
      weight: 1.0
    templates:
    - template: n8n-receipt-to-sheet
      id: wf-main
      name: 分发运营流
      default: true
      override:
        steps:
          ocr:
            name: 渠道分发
            playbook: 按渠道拆适配版本与发布时间，发布后回收数据并按完播/点击做迭代
  stakeholders:
    upstream:
    - 用户
    - 品牌方
    downstream:
    - content_editor
    beneficiaries:
    - 业务方
    - 用户
    blockers:
    - 夸大表述带来合规风险
    - 跨岗口径不一致
    incentives:
    - 发布计划越靠谱，返工越少
    risk_notes:
    - 夸大表述带来合规风险
  capability:
    core:
    - 渠道运营
    - 投放排期
    - 效果复盘
    tools: *id002
    knowledge:
    - 渠道规则
    - 流量机制
    soft:
    - 执行细致
    - 快速迭代
    scoring:
      domain: 4
      tooling: 4
      judging: 3
      execution: 5
      comms: 4
- role: content_editor
  analysis:
    mission: 把素材改成能发出去的样子，并且不出事
    deliverables:
    - 终稿
    - 修改记录
    - 合规校验结果
    inputs:
    - 用户
    - 品牌方
    outputs:
    - 终稿
    - 修改记录
    kpis:
    - 终稿一次通过率
    - 返工次数
    - 交付及时率
  persona:
    seniority: 内容创作资深content_editor
    mindset: 先问清目标，再动手；不确定的地方显式标注
    tone: 有观点、去套话
    decision_rights:
    - 可决定终稿的专业判断
    - 不可越权替代下游岗位下结论
    constraints:
    - 不臆造输入，缺料先要料
    - 守住边界：夸大表述带来合规风险
  plugin:
    bundle: content_editor
    tools: &id003
    - 校对清单
    - 敏感词库
    mcp_categories:
    - 文档协作
    artifacts:
    - name: content_editor-skill
      kind: skill
      path: data/role-profiles/content-creation.yaml
    install_hint: 随行业单元内置，按需挂载
    upstream_plugin: ''
  workflow:
    default_flow: review-gate
    activation:
      weight: 1.0
    templates:
    - template: review-gate
      id: wf-main
      name: 内容审核流
      default: true
      override:
        steps:
          inspect:
            name: 逐项审校
            playbook: 按事实准确性、表述合规、结构可读三段审校，能改就改、不能改就标明原因退回
  stakeholders:
    upstream:
    - 用户
    - 品牌方
    downstream:
    - 发布渠道
    beneficiaries:
    - 业务方
    - 用户
    blockers:
    - 夸大表述带来合规风险
    - 跨岗口径不一致
    incentives:
    - 终稿越靠谱，返工越少
    risk_notes:
    - 夸大表述带来合规风险
  capability:
    core:
    - 润色
    - 事实核查
    - 合规校验
    tools: *id003
    knowledge:
    - 平台内容规范
    - 事实核查方法
    soft:
    - 克制
    - 保守表述
    scoring:
      domain: 3
      tooling: 4
      judging: 4
      execution: 4
      comms: 5
