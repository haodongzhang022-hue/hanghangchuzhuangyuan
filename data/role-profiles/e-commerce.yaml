    install_hint: 随行业单元内置，按需挂载
    upstream_plugin: ''
  workflow:
    default_flow: standard-delivery
    activation:
      weight: 1.0
    templates:
    - template: standard-delivery
      id: wf-main
      name: 投放增长流
      default: true
      override:
        steps:
          execute:
            name: 投放与优化
            playbook: 先定目标 ROI 与人群，再小预算测素材、扩量放大，按归因结论关停无效计划
  stakeholders:
