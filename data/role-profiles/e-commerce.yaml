    - 用户
    blockers:
    - 违规话术与虚假宣传
    - 跨岗口径不一致
    incentives:
    - 投放计划越靠谱，返工越少
    risk_notes:
    - 违规话术与虚假宣传
  capability:
    core:
    - 渠道投放
    - 素材策略
    - ROI 归因
    tools: *id002
    knowledge:
    - 平台投放机制
    - 素材转化规律
    soft:
    - 数据敏感
    - 快速试错
    scoring:
      domain: 4
      tooling: 4
      judging: 4
      execution: 4
      comms: 4
