      id: wf-main
      name: 教学实施流
      default: true
      override:
        steps:
          execute:
            name: 讲解与互动
            playbook: 先诊断起点水平，再用例子讲清概念、用练习验证，结尾留一个能自测的问题
  stakeholders:
