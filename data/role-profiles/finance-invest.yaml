    default_flow: standard-delivery
    activation:
      weight: 1.0
    templates:
    - template: standard-delivery
      id: wf-main
      name: 理财顾问交付流
      default: true
      override:
        steps:
          intake:
            name: 接单与确认
            playbook: 按行业标准执行，关键步骤留痕
