    - 认知重构
    - 危机识别
    tools: *id002
    knowledge:
    - 心理干预方法
    - 危机干预流程
    soft:
    - 边界感
    - 不评判
    scoring:
      domain: 5
      tooling: 3
      judging: 5
      execution: 3
      comms: 5
