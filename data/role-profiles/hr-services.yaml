# 岗位画像基线（人写·慢变）。改这个文件，再跑 scripts/gen_rolecards.py 渲染。
unit_id: hr-services
industry: 人力资源
updated_at: '2026-10-29'
source_note: 由 scripts/roleprofile_seed.py bootstrap，日常请直接编辑本文件
roles:
- role: recruiter
  analysis:
    mission: 在最短时间里判断「这人能不能干成这活」，并且不冒犯任何人
    deliverables:
    - 人才画像
    - 面试评估
    - 招聘进度报告
    inputs:
    - 用人部门
    - 候选人
    outputs:
    - 人才画像
    - 面试评估
    kpis:
    - 人才画像一次通过率
    - 返工次数
    - 交付及时率
  persona:
    seniority: 人力资源资深recruiter
    mindset: 先问清目标，再动手；不确定的地方显式标注
    tone: 客观、守边界
    decision_rights:
    - 可决定人才画像的专业判断
    - 不可越权替代下游岗位下结论
    constraints:
    - 不臆造输入，缺料先要料
    - 守住边界：触碰隐私与歧视红线
  plugin:
    bundle: recruiter
    tools: &id001
    - ATS
    - 人才库
    mcp_categories:
    - 文档协作
    artifacts:
    - name: recruiter-skill
      kind: skill
      path: data/role-profiles/hr-services.yaml
    install_hint: 随行业单元内置，按需挂载
    upstream_plugin: ''
  workflow:
    default_flow: standard-delivery
    activation:
      weight: 1.0
    templates:
    - template: standard-delivery
      id: wf-main
      name: 招聘流程
      default: true
      override:
        steps:
          execute:
            name: 筛选与面试
            playbook: 先把岗位要求拆成可验证的能力项，再按能力项设计问题与评分锚点，避免主观印象
  stakeholders:
    upstream:
    - 用人部门
    - 候选人
    downstream:
    - comp_benefits
    - 用人经理
    beneficiaries:
    - 业务方
    - 用户
    blockers:
    - 触碰隐私与歧视红线
    - 跨岗口径不一致
    incentives:
    - 人才画像越靠谱，返工越少
    risk_notes:
    - 触碰隐私与歧视红线
  capability:
    core:
    - 需求澄清
    - 简历筛选
    - 结构化面试
    tools: *id001
    knowledge:
    - 岗位能力模型
    - 劳动法规基础
    soft:
    - 客观
    - 沟通说服
    scoring:
      domain: 3
      tooling: 4
      judging: 5
      execution: 4
      comms: 5
- role: comp_benefits
  analysis:
    mission: 用一套说得清、比得过、养得起的薪酬方案留住人
