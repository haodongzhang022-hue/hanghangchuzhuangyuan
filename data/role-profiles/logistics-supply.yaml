          declare:
            name: 单证申报
            playbook: 单证三单一致（合同/发票/箱单）
            outputs:
            - 报关单证
            verify:
            - 三单金额与品名一致
            runtime: agent
          gate:
            name: 合规复核
            playbook: 低报瞒报一律不做，风险项双人复核
            outputs:
            - 复核记录
            verify:
