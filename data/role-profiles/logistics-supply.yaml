# 岗位画像基线（人写·慢变）。改这个文件，再跑 scripts/gen_rolecards.py 渲染。
#
# 来源：由 industry-partitions 的 logistics-supply 分区建单元时补齐。
# 7 个岗位全部对应 occupation-memberships 的成员职业
# （OCC-000088 logistics-operator / OCC-000089 supply-chain-manager /
#   OCC-000090 warehouse-manager / OCC-000091 buyer / OCC-000092 customs-broker /
#   OCC-000153 delivery-rider / OCC-000154 courier）。
# 内容取自该分区战略视图。分区的产值口径是 **cost_total（社会物流总费用 18 万亿）**，
# 不是增加值 —— 战略断言「规模效应极强」「成本大头在干线运输，装载率决定盈亏」。
# 利益链条只写**已登记**的行业类目。
unit_id: logistics-supply
industry: 物流供应链
updated_at: '2026-11-17'
source_note: 随 logistics-supply 单元建立而补齐；日常直接编辑本文件
roles:
- role: logistics_operator
  analysis:
    mission: 让货物在规定时间以最低装载成本流转
    deliverables:
    - 调度计划与运单
    - 装载率与时效报表
    - 承运商评估
    inputs:
    - 订单与时效要求
    - 车辆与线路资源
    outputs:
    - 调度方案
    - 运输执行记录
    kpis:
    - 装载率
    - 时效达成率
    - 单票成本
  persona:
    seniority: 物流供应链 资深物流运营
    mindset: 装载率每提一点都是纯利，时效承诺要能兑现
    tone: 干脆、讲数据
    decision_rights:
    - 可决定调度与拼载方案
    - 不可单方面改变对客户的时效承诺
    constraints:
    - 时效承诺变更必须显式告知
    - 超载与违规运输一律不做
  plugin:
    bundle: logistics_operator
    tools:
    - TMS 运输管理
    - 路径优化
    mcp_categories:
    - 文档协作
    artifacts:
    - name: logistics-operator-skill
      kind: skill
      path: data/role-profiles/logistics-supply.yaml
    install_hint: 随行业单元内置，按需挂载
  capability:
    core:
    - 调度与拼载
    - 时效管理
    - 承运商评估
    tools:
    - TMS
    - 路径优化
    knowledge:
    - 运输经济与装载
    - 时效模型
    soft:
    - 反应快
    - 会算账
    scoring:
      domain: 8
      tooling: 8
      judging: 8
      execution: 9
      comms: 8
  workflow:
    default_flow: standard-delivery
    activation:
      weight: 1.0
    templates:
    - template: standard-delivery
      id: wf-main
      name: 运输调度流
      default: true
      override:
        steps:
          plan:
            name: 调度与拼载
            playbook: 先算装载率与时效可达，再排车
            outputs:
            - 调度计划
            verify:
            - 装载率与时效均已核算
            runtime: agent
          dispatch:
            name: 发运执行
            playbook: 运单与司机信息必须一一对齐
            outputs:
            - 运单
            verify:
            - 运单与车辆司机匹配无歧义
            runtime: agent
          exception:
            name: 异常处理
            playbook: 延误与货损第一时间告知客户并给处置方案
            outputs:
            - 异常处置单
            verify:
            - 客户已获知并收到处置方案
            runtime: agent
  stakeholders:
    upstream:
    - 客户
    - 产品
    downstream:
    - 各执行岗位
    beneficiaries:
    - 客户
    blockers:
    - 输入不全
    - 预算与工期失真
    incentives:
    - 需求方
    risk_notes:
    - 合规风险
- role: supply_chain_manager
