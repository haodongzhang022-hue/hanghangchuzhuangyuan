            name: 揽件与验视
            playbook: 实名收寄与开箱验视不得省略
            outputs:
            - 揽件记录
            verify:
            - 验视记录完整
            runtime: agent
          dispatch:
            name: 派件与交接
            playbook: 按约定投递，驿站交接需签认
            outputs:
            - 交接记录
            verify:
            - 交接有签认
            runtime: agent
          exception:
            name: 异常处理
            playbook: 丢损破损立即上报并联系收寄双方
            outputs:
            - 异常单
            verify:
            - 双方均已获知
            runtime: agent
  stakeholders:
    upstream:
    - 客户
    downstream:
    - 用户
    beneficiaries:
    - 用户
    blockers:
    - 输入不全
    - 合规风险
    incentives:
    - 需求方
    risk_notes:
    - 合规风险
