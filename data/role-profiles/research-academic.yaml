            name: 撰写申请文件
            playbook: 权利要求逐条对应技术特征
            outputs:
            - 申请文件
            verify:
            - 每项权利要求有说明书支持
            runtime: agent
          reply:
            name: 答复审查意见
            playbook: 不扩大范围，逐条回应审查员质疑
            outputs:
            - 答复意见
            verify:
            - 答复未超出原始范围
            runtime: agent
