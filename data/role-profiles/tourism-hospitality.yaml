      judging: 7
      execution: 8
      comms: 9
  workflow:
    default_flow: fast-answer
    activation:
      weight: 1.0
    templates:
    - template: fast-answer
      id: wf-main
      name: 客诉快答流
      default: true
      override:
        steps:
          understand:
            name: 理解诉求
            playbook: 先分清是政策问题还是服务问题
            outputs:
            - 诉求归类
            verify:
            - 已判定问题类别
            runtime: agent
          answer:
            name: 给出方案
            playbook: 方案要可执行且写明条件
            outputs:
            - 处理方案
            verify:
            - 方案在授权范围内
            runtime: agent
          boundary:
            name: 升级与留痕
            playbook: 超权限必须升级，不得口头承诺
            outputs:
            - 升级记录
            verify:
            - 超权限项已升级
            runtime: agent
  stakeholders:
    upstream:
