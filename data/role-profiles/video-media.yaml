  plugin:
    bundle: video_editor
    tools:
    - 行业资料库
    mcp_categories:
    - 文档协作
    artifacts:
    - name: video_editor-skill
      kind: skill
      path: data/role-profiles/video-media.yaml
    install_hint: 随行业单元内置，按需挂载
  capability:
    core:
    - 视频剪辑
    tools:
    - 剪辑
    - 粗剪
    - 精剪
    knowledge:
    - 视频影视行业常识
    soft:
    - 抗压
    - 沟通
    scoring:
      domain: 7
      tooling: 7
      judging: 7
      execution: 8
      comms: 7
  workflow:
    default_flow: standard-delivery
    activation:
      weight: 1.0
    templates:
    - template: standard-delivery
      id: wf-main
      name: 视频剪辑交付流
      default: true
      override:
        steps:
          intake:
            name: 接单与确认
            playbook: 按行业标准执行，关键步骤留痕
            outputs:
