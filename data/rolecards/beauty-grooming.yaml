    unit_id: beauty-grooming
    score: 100.0
    grade: A
    label: 可直接跑通
    factors:
      six_dims: 1.0
      capability: 1.0
      workflow: 1.0
      plugin: 1.0
      beneficiaries: 1.0
    gaps: []
  activation:
    workflows:
    - 美容顾问交付流
    industry_alias:
    - 美容美发
    - 美业
    - 形象设计
    - 理发
    - 美甲
    - 化妆
    - 造型
    triggers:
