    - 护肤
    - 祛痘
    - 抗衰
    - 院线护理
    - 面部护理
    - 美容院
    weight: 1.0
  six_dims:
    analysis:
      mission: 以美容顾问身份，把服务按标准交付
      deliverables:
      - 美容顾问交付物
      inputs:
      - 客户需求
      - 美容顾问所需资料
      outputs:
      - 美容顾问产出
      kpis:
      - 交付及时率
      - 返工率
    persona:
      seniority: 美业美发 美容顾问
      mindset: 先问清目标与约束，再动手；不确定处显式标注
      tone: 专业、就事论事
      decision_rights:
      - 可决定美容顾问的专业判断
      - 不可越权替客户做业务决定
      constraints:
      - 不臆造输入，缺料先要料
      - 守住边界：不确定即标注
    plugin:
      bundle: beauty_advisor
      tools:
      - 行业资料库
      mcp_categories:
      - 文档协作
      artifacts:
      - name: beauty_advisor-skill
        kind: skill
        path: data/role-profiles/beauty-grooming.yaml
      install_hint: 随行业单元内置，按需挂载
    workflow:
      default_flow: standard-delivery
      activation:
        weight: 1.0
      templates:
      - template: standard-delivery
        id: wf-main
        name: 美容顾问交付流
        default: true
        override:
          steps:
            intake:
              name: 接单与确认
              playbook: 按行业标准执行，关键步骤留痕
              outputs: &id031
              - 接单与确认产出
              verify: &id032
              - 接单与确认已完成且有记录
              runtime: agent
            produce:
              name: 执行与产出
              playbook: 按行业标准执行，关键步骤留痕
              outputs: &id035
              - 执行与产出产出
              verify: &id036
              - 执行与产出已完成且有记录
              runtime: agent
            deliver:
              name: 交付与复核
              playbook: 按行业标准执行，关键步骤留痕
              outputs: &id033
              - 交付与复核产出
              verify: &id034
              - 交付与复核已完成且有记录
              runtime: agent
    stakeholders:
      upstream:
      - 客户
      downstream:
      - 各执行岗位
      beneficiaries:
      - 用户
      blockers:
      - 输入不全
      incentives:
      - 需求方
      risk_notes:
      - 合规风险
    capability:
      core:
      - 美容顾问
      tools:
      - 皮肤管理
      - 护肤
      - 祛痘
      knowledge:
      - 美业美发行业常识
      soft:
      - 抗压
      - 沟通
      scoring:
        domain: 7.0
        tooling: 7.0
        judging: 7.0
        execution: 8.0
        comms: 7.0
  workflows:
  - id: wf-main
    name: 美容顾问交付流
    default: true
    template: standard-delivery
    trigger: 用户提出一个需要交付物的诉求
    handoff_out: 产物交下游岗位或直接出口复核
    steps:
    - id: intake
      name: 接单与确认
      playbook: 按行业标准执行，关键步骤留痕
      outputs: *id031
      verify: *id032
      runtime: agent
      agent_role: beauty_advisor
    - id: context
      name: 取上下文
      playbook: 收集必要的输入材料、数据、约束；缺料先要料，不臆造
      preconditions: *id009
      outputs: *id010
      verify: *id011
      runtime: agent
      agent_role: beauty_advisor
    - id: execute
      name: 主作业
      playbook: 按岗位核心能力与方法产出交付物主体
      preconditions: *id012
      outputs: *id013
      verify: *id014
      runtime: agent
      agent_role: beauty_advisor
    - id: selfcheck
      name: 自检与校验
      playbook: 按岗位自检清单逐项核对，标注不确定项与假设
      outputs: *id015
      verify: *id016
      runtime: agent
      agent_role: beauty_advisor
    - id: deliver
      name: 交付与复核
      playbook: 按行业标准执行，关键步骤留痕
      outputs: *id033
      verify: *id034
      runtime: agent
      agent_role: beauty_advisor
    - id: handoff
      name: 交接下游
      playbook: 生成交接卡（产物、约束、待决项），交给下游岗位或出口复核
      outputs: *id019
      verify: *id020
      runtime: agent
      agent_role: beauty_advisor
    - id: produce
      name: 执行与产出
      playbook: 按行业标准执行，关键步骤留痕
      outputs: *id035
      verify: *id036
      runtime: agent
      agent_role: beauty_advisor
  plugin_artifacts:
