      outputs: &id007
      - 交付物主体
      verify: &id008
      - 满足验收口径
      runtime: agent
      agent_role: graphic_designer
    - id: selfcheck
      name: 自检与校验
      playbook: 按岗位自检清单逐项核对，标注不确定项与假设
