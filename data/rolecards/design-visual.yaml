      playbook: 按岗位画像的语气与结构输出，附依据与后续建议
      outputs: &id011
      - 交付说明
      verify: &id012
      - 结论可回溯到依据
      runtime: agent
      agent_role: graphic_designer
    - id: handoff
      name: 交接下游
      playbook: 生成交接卡（产物、约束、待决项），交给下游岗位或出口复核
