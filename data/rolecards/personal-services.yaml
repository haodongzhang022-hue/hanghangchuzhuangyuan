    kind: skill
    path: data/role-profiles/personal-services.yaml
  sources:
  - role-profiles/personal-services.yaml
  chain_refs:
    upstream:
    - raw: 客户
      value: 客户
      kind: industry_class
      ref: industry_class:客户
      index: *id023
