  industry: 公共安全应急
  prefix: '[军警]'
  description: 军官警官 指挥 执法
  keywords:
  - 军官
  - 警官
  - 执法
  - 部队
  readiness:
    role_name: military_officer
    unit_id: public-safety
    score: 100.0
    grade: A
    label: 可直接跑通
    factors:
      six_dims: 1.0
      capability: 1.0
      workflow: 1.0
      plugin: 1.0
      beneficiaries: 1.0
    gaps: []
  activation:
    workflows:
    - 军官/警官交付流
    industry_alias:
    - 安防
    - 应急管理
    - 消防
    - 应急预案
    - 安保
    - 风险监测
    triggers:
    - 军官
    - 警官
    - 执法
    - 部队
    weight: 1.0
  six_dims:
    analysis:
      mission: 以军官/警官身份，把服务按标准交付，边界外的事明确移交
      deliverables:
      - 军官/警官交付物
      inputs:
      - 客户需求
      - 军官/警官所需资料
      outputs:
      - 军官/警官产出
      kpis:
      - 交付及时率
      - 返工率
    persona:
      seniority: 公共安全应急 军官/警官
      mindset: 先问清目标与边界，再动手；不确定处显式标注
      tone: 专业、就事论事
      decision_rights:
      - 可决定军官/警官的专业判断
      - 不可越权替客户或责任方做决定
      constraints:
      - 不臆造输入，缺料先要料
      - 守住边界：不确定即标注
    plugin:
      bundle: military_officer
      tools:
      - 行业资料库
      mcp_categories:
      - 文档协作
      artifacts:
      - name: military_officer-skill
        kind: skill
        path: data/role-profiles/public-safety.yaml
      install_hint: 随行业单元内置，按需挂载
    workflow:
      default_flow: standard-delivery
      activation:
        weight: 1.0
      templates:
      - template: standard-delivery
        id: wf-main
        name: 军官/警官交付流
        default: true
        override:
          steps:
            intake:
              name: 接单与边界
              playbook: 按行业标准执行，关键步骤留痕
              outputs: &id029
              - 接单与边界产出
              verify: &id030
              - 接单与边界已完成且有记录
              runtime: agent
            deliver:
              name: 交付与复核
              playbook: 按行业标准执行，关键步骤留痕
              outputs: &id031
              - 交付与复核产出
              verify: &id032
              - 交付与复核已完成且有记录
              runtime: agent
    stakeholders:
      upstream:
      - 客户
      downstream:
      - 各执行岗位
      beneficiaries:
      - 用户
      blockers:
      - 输入不全
      incentives:
      - 需求方
      risk_notes:
      - 合规风险
    capability:
      core:
      - 军官/警官
      tools:
      - 军官
      - 警官
      - 执法
      knowledge:
      - 公共安全应急行业常识
      soft:
      - 抗压
      - 沟通
      scoring:
        domain: 7.0
        tooling: 7.0
        judging: 7.0
        execution: 8.0
        comms: 7.0
  workflows:
  - id: wf-main
    name: 军官/警官交付流
    default: true
    template: standard-delivery
    trigger: 用户提出一个需要交付物的诉求
    handoff_out: 产物交下游岗位或直接出口复核
    steps:
    - id: intake
      name: 接单与边界
      playbook: 按行业标准执行，关键步骤留痕
      outputs: *id029
      verify: *id030
      runtime: agent
      agent_role: military_officer
    - id: context
      name: 取上下文
      playbook: 收集必要的输入材料、数据、约束；缺料先要料，不臆造
      preconditions: *id009
      outputs: *id010
      verify: *id011
      runtime: agent
      agent_role: military_officer
    - id: execute
      name: 主作业
      playbook: 按岗位核心能力与方法产出交付物主体
      preconditions: *id012
      outputs: *id013
      verify: *id014
      runtime: agent
      agent_role: military_officer
    - id: selfcheck
      name: 自检与校验
      playbook: 按岗位自检清单逐项核对，标注不确定项与假设
      outputs: *id015
      verify: *id016
      runtime: agent
      agent_role: military_officer
    - id: deliver
      name: 交付与复核
      playbook: 按行业标准执行，关键步骤留痕
      outputs: *id031
      verify: *id032
      runtime: agent
      agent_role: military_officer
    - id: handoff
      name: 交接下游
      playbook: 生成交接卡（产物、约束、待决项），交给下游岗位或出口复核
      outputs: *id019
      verify: *id020
      runtime: agent
      agent_role: military_officer
  plugin_artifacts:
  - name: military_officer-skill
    kind: skill
    path: data/role-profiles/public-safety.yaml
  sources:
  - role-profiles/public-safety.yaml
  chain_refs:
    upstream:
    - raw: 客户
      value: 客户
      kind: industry_class
      ref: industry_class:客户
      index: *id023
      note: 需求方
    downstream:
    - raw: 各执行岗位
      value: 各执行岗位
      kind: industry_class
      ref: industry_class:各执行岗位
      note: 内部组织
    beneficiaries:
    - raw: 用户
      value: 用户
      kind: industry_class
      ref: industry_class:用户
      index: *id024
      note: 需求方
    blockers:
    - raw: 输入不全
      value: 输入不全
      kind: industry_class
      ref: industry_class:输入不全
      note: 阻碍
